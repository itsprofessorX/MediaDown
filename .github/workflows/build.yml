name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/MediaDown-${{ github.run_number }}.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDown-apk
          path: out/*.apk
      - name: Send APK to Telegram
        if: ${{ env.TG_TOKEN != '' && env.TG_CHAT != '' }}
        run: |
          F=$(ls out/*.apk | head -1)
          SIZE=$(stat -c%s "$F")
          MSG=$(git log -1 --pretty=%s)
          if [ "$SIZE" -lt 49000000 ]; then
            curl -sS --fail-with-body -o /dev/null \
              -F chat_id="$TG_CHAT" -F document=@"$F" \
              -F caption="MediaDown build #${{ github.run_number }} - $MSG" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
          else
            curl -sS --fail-with-body -o /dev/null -d chat_id="$TG_CHAT" \
              --data-urlencode text="MediaDown build #${{ github.run_number }} is ready but over Telegram's 50 MB bot limit. Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          fi
