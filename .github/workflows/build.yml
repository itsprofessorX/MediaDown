name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/MediaDown-${{ github.run_number }}.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDown-apk
          path: out/*.apk
      - name: Send APK to Telegram
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::error::Secrets missing. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi
          F=$(ls out/*.apk | head -1)
          SIZE=$(stat -c%s "$F")
          echo "APK size: $((SIZE/1048576)) MB"
          MSG=$(git log -1 --pretty=%s)
          if [ "$SIZE" -lt 49000000 ]; then
            R=$(curl -sS -F chat_id="$TG_CHAT" -F document=@"$F" \
              -F caption="MediaDown build #${{ github.run_number }} - $MSG" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")
          else
            R=$(curl -sS -d chat_id="$TG_CHAT" \
              --data-urlencode text="Build #${{ github.run_number }} is over 50 MB. Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage")
          fi
          echo "Telegram replied: $R"
          echo "$R" | grep -q '"ok":true' || { echo "::error::Telegram rejected the upload (see reply above)."; exit 1; }
